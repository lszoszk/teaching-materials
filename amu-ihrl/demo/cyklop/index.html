<script>
(async () => {
  const D = JSON.parse(document.getElementById('dane').textContent), PAM = 'haslo_' + location.pathname;
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norm = s => s.trim().toLowerCase().replace(/\s+/g, '');
  async function otworz(kod) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(kod)), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(D.sol), iterations: D.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(D.iv) }, key, b(D.szyfr));
    const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    try { localStorage.setItem(PAM, kod); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  const msg = document.getElementById('msg');
  let zapamietany = null;
  try { zapamietany = localStorage.getItem(PAM); } catch (e) {}
  if (zapamietany) { try { await otworz(zapamietany); return; } catch (e) { try { localStorage.removeItem(PAM); } catch (e2) {} } }
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    msg.textContent = 'Otwieram…';
    try { await otworz(document.getElementById('k').value); }
    catch (err) { msg.textContent = 'Nieprawidłowe hasło. Spróbuj jeszcze raz.'; }
  });
})();
</script>
